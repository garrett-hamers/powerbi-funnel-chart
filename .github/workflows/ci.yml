name: CI

on:
  push:
    branches:
      - main
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Package
        run: npm run package
      - name: Record package hash
        run: |
          shopt -s nullglob
          artifacts=(dist/*.pbiviz)
          if [ "${#artifacts[@]}" -ne 1 ]; then
            echo "Expected exactly one dist/*.pbiviz, found ${#artifacts[@]}" >&2
            exit 1
          fi
          artifact="${artifacts[0]}"
          name="$(basename "$artifact")"
          sha="$(sha256sum "$artifact" | cut -d ' ' -f 1)"
          bytes="$(stat -c %s "$artifact")"
          css="$(node -e '
            const { readPackagedBundle } = require("./scripts/packaged-bundle.cjs");
            readPackagedBundle().then((bundle) => process.stdout.write(String(bundle.cssBytes)));
          ')"
          echo "Packaged $name"
          echo "  SHA-256: $sha"
          echo "  bytes:   $bytes"
          echo "  css:     $css"
          {
            echo "### Packaged visual"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Filename | \`$name\` |"
            echo "| SHA-256 | \`$sha\` |"
            echo "| Bytes | \`$bytes\` |"
            echo "| Packaged CSS bytes | \`$css\` |"
            echo
            echo "This SHA-256 is of the \`.pbiviz\` itself. The downloadable artifact is a"
            echo "zip wrapper added by \`actions/upload-artifact\`, so hash the extracted file"
            echo "rather than the download."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Small-tile layout probe
        run: npm run layout-probe
      - name: Upload packaged visual
        uses: actions/upload-artifact@v4
        with:
          name: atlyn-funnel-pbiviz
          path: dist/*.pbiviz
          if-no-files-found: error
      - name: Sample report
        run: npm run sample-report
      - name: Release manifest
        run: npm run release-manifest
      - name: Certification audit
        run: npm run certification-audit
      - name: Dependency audit
        run: npm run audit
